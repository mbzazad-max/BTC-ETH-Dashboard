name: Build and deploy BTC & ETH dashboard
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run (the Refresh button fills this in)'
        required: false
        default: 'manual'
      force:
        description: 'Rebuild even if no new candles or readings arrived'
        type: boolean
        default: false
  schedule:
    - cron: '15 1 * * *'   # once a day as a safety net (12:15 Sydney summer time), after the 11:30 TradingView load; data commits trigger it too
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'public/index.html', 'public/shim.js', 'public/cloud.js', 'public/usdtd.js', 'history/total2es_1d.csv', 'history/eth_1d.csv', 'worker/**', 'build/**', 'config/**', 'tools/**', 'wrangler.jsonc', 'reference/**']
permissions:
  contents: write
  issues: write   # build/signals.js: a GitHub issue per new 3/5+ checklist signal, which GitHub emails to the owner
concurrency:
  group: btc-eth-dashboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: The page must be the original artifact, unchanged
        run: node tools/check_page.js
      - name: Check secrets
        env:
          MD: ${{ secrets.MARKET_DATA_TOKEN }}
        run: '[ -n "$MD" ] || { echo "::error::Secret MARKET_DATA_TOKEN is not set, so the shared data cannot be read. Nothing changed."; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: mbzazad-max/market-data
          token: ${{ secrets.MARKET_DATA_TOKEN }}
          path: md
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the snapshot from closed candles (keeps last good data on any failure)
        run: node build/build.js md ${{ inputs.force && '--force' || '' }}
      - name: Install jsdom and d3 (to run the page's own engine at build time)
        run: mkdir -p /tmp/nm && (cd /tmp/nm && npm init -y >/dev/null && npm i --no-save --silent jsdom@24 d3@7.9.0)
      - name: Structure test, zone only vs zone + 4H MSS (only new days are worked out; skipped with a warning if it fails)
        run: node build/structure_test.js /tmp/nm/node_modules md > /dev/null
      - name: Spot buy checklist (the page's own engine on the new snapshot; skipped with a warning if it fails)
        run: node build/checklist.js /tmp/nm/node_modules
      - name: Signal history (logs every 3/5+ checklist change; skipped with a warning if it fails)
        run: node build/signals.js
      - name: Bull case / Bear case triggers (a daily close beyond the level shown the day before; skipped with a warning if it fails)
        run: node build/levels.js /tmp/nm/node_modules md
      - name: USDT.D tab, USDT.D vs its 20/50/100/200 SMAs in BTC bulls and bears (keeps the last good file if it fails)
        run: node build/usdtd.js md
      - name: BTC cycle tab, BTC vs its 20/50/100/200 SMAs, top/bottom watch and every BTC swing (keeps the last good file if it fails)
        run: node build/usdtd.js md --asset=btc
      - name: TOTAL2ES tab, altcoin market cap vs its 20/50/100/200 SMAs, top/bottom watch and every swing (keeps the last good file if it fails)
        run: node build/usdtd.js md --asset=total2es
      - name: ETH cycle tab, ETH vs its 20/50/100/200 SMAs, top/bottom watch and every ETH swing (keeps the last good file if it fails)
        run: node build/usdtd.js md --asset=eth
      - name: SOL and BNB cycle tabs, the same analysis for each coin with its own cycle dates (keeps the last good file if it fails)
        run: node build/usdtd.js md --asset=sol; node build/usdtd.js md --asset=bnb
      - name: S&P 500 tab, the cycle analysis on SP:SPX daily plus what BTC did next in each S&P state (keeps the last good file if it fails)
        run: node build/usdtd.js md --asset=spx
      - name: Save the new snapshot (one commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/snapshot.json public/freshness.json public/usdtd.json history/plans.json history/structure_test.json history/signals.json
          [ -f history/levels.json ] && git add history/levels.json
          [ -f history/usdtd_log.json ] && git add history/usdtd_log.json
          [ -f public/btccycle.json ] && git add public/btccycle.json
          [ -f history/btc_log.json ] && git add history/btc_log.json
          [ -f public/total2es.json ] && git add public/total2es.json
          [ -f history/total2es_log.json ] && git add history/total2es_log.json
          [ -f public/ethcycle.json ] && git add public/ethcycle.json
          [ -f history/eth_log.json ] && git add history/eth_log.json
          for c in sol bnb spx; do [ -f public/${c}cycle.json ] && git add public/${c}cycle.json; [ -f history/${c}_log.json ] && git add history/${c}_log.json; done
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Dashboard build $(node -p "require('./public/freshness.json').generated")"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep $((i*2)); done
          echo "::error::Could not save the snapshot."; exit 1
      - name: Email new signals and Bull / Bear case triggers (a GitHub issue that mentions the owner; GitHub sends the email)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/signal_alerts.json ] || [ -s /tmp/level_alerts.json ] || exit 0
          node -e '
            const fs = require("fs"), rd = (f) => (fs.existsSync(f) && fs.statSync(f).size ? JSON.parse(fs.readFileSync(f, "utf8")) : []);
            const a = rd("/tmp/signal_alerts.json").concat(rd("/tmp/level_alerts.json"));
            a.forEach((x, i) => { require("fs").writeFileSync("/tmp/alert_" + i + ".md", x.body + "\n\n@mbzazad-max"); require("fs").writeFileSync("/tmp/alert_" + i + ".title", x.title); });
            console.log(a.length);' > /tmp/alert_n
          n=$(cat /tmp/alert_n); i=0
          while [ $i -lt $n ]; do
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat /tmp/alert_$i.title)" --body-file /tmp/alert_$i.md || echo "::warning::Could not open the alert issue: $(cat /tmp/alert_$i.title)"
            i=$((i+1))
          done
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRESH_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Cloudflare secrets not set; built but not deployed."; exit 0; fi
          # a pasted secret can carry a stray space or line break; a real token and account id never contain whitespace
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "Token: ${#CLOUDFLARE_API_TOKEN} characters; account id: ${#CLOUDFLARE_ACCOUNT_ID} characters (expected 32)."
          [ ${#CLOUDFLARE_ACCOUNT_ID} -eq 32 ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID from the Cloudflare dashboard (it has ${#CLOUDFLARE_ACCOUNT_ID}). The built data is saved; the site keeps its last deploy."; exit 1; }
          npx -y wrangler@4 deploy || { echo "::error::Cloudflare refused the deploy. Check the CLOUDFLARE_API_TOKEN secret (only the token value, Workers Scripts: Edit on your account) and CLOUDFLARE_ACCOUNT_ID (32 characters). The built data is saved; the site keeps its last deploy."; exit 1; }   # workers_dev is off: only the home site (dashboards) can reach this Worker
          printf '%s' "$REFRESH_TOKEN" | npx -y wrangler@4 secret put GITHUB_TOKEN
